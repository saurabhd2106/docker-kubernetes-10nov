<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0d4d"/>
      <stop offset="0.6" stop-color="#3b2aa8"/>
      <stop offset="1" stop-color="#127a8a"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a53b"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- config panel -->
  <g transform="translate(110 110)">
    <rect width="520" height="380" rx="22" fill="#0d0827" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.18"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="21">
      <text x="34" y="68" fill="#ffffff" fill-opacity="0.45"># environment</text>
      <text x="34" y="114" fill="#89ddff">Blog__Title<tspan fill="#ffffff">=</tspan><tspan fill="#c3e88d">"Field Notes"</tspan></text>
      <text x="34" y="154" fill="#89ddff">Blog__PostsPerPage<tspan fill="#ffffff">=</tspan><tspan fill="#f78c6c">9</tspan></text>
      <text x="34" y="194" fill="#89ddff">ASPNETCORE_ENVIRONMENT<tspan fill="#ffffff">=</tspan><tspan fill="#c3e88d">Production</tspan></text>
      <text x="34" y="234" fill="#89ddff">ConnectionStrings__Db<tspan fill="#ffffff">=</tspan><tspan fill="#ffcb6b">********</tspan></text>
    </g>
    <g transform="translate(34 280)">
      <rect width="72" height="38" rx="19" fill="#5be3a6"/>
      <circle cx="53" cy="19" r="14" fill="#ffffff"/>
      <rect x="100" width="72" height="38" rx="19" fill="#ffffff" fill-opacity="0.2"/>
      <circle cx="119" cy="19" r="14" fill="#ffffff"/>
      <rect x="200" width="72" height="38" rx="19" fill="#5be3a6"/>
      <circle cx="253" cy="19" r="14" fill="#ffffff"/>
    </g>
  </g>

  <!-- key -->
  <g transform="translate(860 300) rotate(-35)">
    <circle cx="-120" cy="0" r="92" fill="url(#key)"/>
    <circle cx="-120" cy="0" r="40" fill="#2a1d7a"/>
    <rect x="-40" y="-24" width="270" height="48" rx="12" fill="url(#key)"/>
    <rect x="150" y="18" width="30" height="58" rx="6" fill="url(#key)"/>
    <rect x="196" y="18" width="30" height="40" rx="6" fill="url(#key)"/>
  </g>
  <circle cx="1060" cy="120" r="10" fill="#ffe08a" fill-opacity="0.7"/>
  <circle cx="1110" cy="180" r="6" fill="#ffe08a" fill-opacity="0.5"/>
  <circle cx="1010" cy="500" r="8" fill="#7cd0ff" fill-opacity="0.6"/>
</svg>
