<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06213f"/>
      <stop offset="1" stop-color="#0b4f8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2496ed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2496ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cd0ff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- host -->
  <rect x="90" y="150" width="330" height="300" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="125" y="200" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#cfe9ff" fill-opacity="0.7">your machine</text>
  <rect x="125" y="230" width="260" height="56" rx="10" fill="#ffffff" fill-opacity="0.1"/>
  <text x="145" y="266" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#ffffff">localhost:9090</text>
  <rect x="125" y="306" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="125" y="334" width="230" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="125" y="362" width="140" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="420" cy="300" r="18" fill="#06213f" stroke="#7cd0ff" stroke-width="4"/>

  <!-- the mapping -->
  <path d="M438 300 C 560 180, 640 420, 762 300" fill="none" stroke="url(#wire)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="520" cy="250" r="6" fill="#7cd0ff"/>
  <circle cx="600" cy="300" r="6" fill="#9fc0ff"/>
  <circle cx="680" cy="350" r="6" fill="#b9a6ff"/>
  <rect x="520" y="430" width="160" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="600" y="462" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#ffffff">-p 9090:8080</text>

  <!-- container -->
  <rect x="780" y="150" width="330" height="300" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#b9a6ff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="815" y="200" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#e1d8ff" fill-opacity="0.75">container</text>
  <rect x="815" y="230" width="260" height="56" rx="10" fill="#ffffff" fill-opacity="0.1"/>
  <text x="835" y="266" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#ffffff">0.0.0.0:8080</text>
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
    <path d="M860 320v90M910 320v90M960 320v90M1010 320v90M1060 320v90"/>
  </g>
  <circle cx="780" cy="300" r="18" fill="#06213f" stroke="#b9a6ff" stroke-width="4"/>
</svg>
